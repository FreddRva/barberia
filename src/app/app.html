<!-- MAIN APPLICATION CONTENT SHELL -->
<div class="min-h-screen flex flex-col w-full">
    @switch (activeView()) {
        @case ('login') {
            <app-login (viewChanged)="handleViewChange($event)" (alertTriggered)="triggerAlert($event)"></app-login>
        }
        @case ('client') {
            <app-client-layout (viewChanged)="handleViewChange($event)" (alertTriggered)="triggerAlert($event)"></app-client-layout>
        }
        @case ('admin') {
            <app-admin-layout (viewChanged)="handleViewChange($event)" (alertTriggered)="triggerAlert($event)"></app-admin-layout>
        }
    }
</div>

<!-- 3. FLOATING TOAST NOTIFICATION -->
@if (alertState().active) {
    <div class="fixed bottom-5 right-5 z-[20000] animate-fade-up max-w-sm w-full bg-[#161820]/95 backdrop-blur border border-white/10 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i class="fa-solid" [class.fa-circle-check]="alertState().type === 'success'" [class.text-emerald-400]="alertState().type === 'success'" [class.fa-circle-exclamation]="alertState().type !== 'success'" [class.text-red-400]="alertState().type !== 'success'"></i>
        <span class="text-xs font-bold text-white">{{ alertState().message }}</span>
    </div>
}
