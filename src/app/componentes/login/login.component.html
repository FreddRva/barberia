<section
  class="flex-grow flex justify-center items-center bg-[#07080a] p-4 min-h-[calc(100vh-32px)] relative overflow-hidden"
>
  <div
    class="absolute w-[300px] h-[300px] bg-gold/10 rounded-full blur-[120px] -top-12 -left-12 pointer-events-none"
  ></div>
  <div
    class="absolute w-[250px] h-[250px] bg-gold/5 rounded-full blur-[100px] -bottom-12 -right-12 pointer-events-none"
  ></div>

  <div
    class="login-split-card animate-fade-up max-w-[850px] w-full flex flex-col md:flex-row glass-effect rounded-3xl overflow-hidden border border-white/15 shadow-2xl relative z-10"
  >
    <div
      class="w-full md:w-1/2 min-h-[280px] md:min-h-[520px] bg-cover bg-center relative"
      style="background-image: url('login_barber.png')"
    >
      <div
        class="absolute inset-0 bg-gradient-to-t from-[#0a0b0e] via-[#0a0b0e]/40 to-transparent"
      ></div>
      <div class="absolute bottom-6 left-6 text-left">
        <span class="text-gold text-[9px] font-extrabold tracking-[4px] uppercase block mb-1"
          >HAUTE COUTURE</span
        >
        <h3 class="text-white text-xl font-bold tracking-wide uppercase">L'ÉLITE PARIS</h3>
      </div>
    </div>

    <div
      class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center bg-[#0e1015] border-t md:border-t-0 md:border-l border-white/10"
    >
      <div class="mb-6 text-center">
        <h2
          class="text-3xl font-extrabold tracking-[6px] bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-500 bg-clip-text text-transparent font-outfit uppercase leading-none mb-2"
        >
          L'ÉLITE
        </h2>
        <p class="text-[9px] font-extrabold tracking-[3px] text-zinc-400 uppercase">
          Estilo con distinción
        </p>
      </div>

      <form (submit)="handleLogin()">
        <div class="mb-4 text-left">
          <label class="block text-[9px] font-bold text-gold uppercase tracking-[2px] mb-1.5"
            ><i class="fa-solid fa-envelope mr-1 text-[8px]"></i> Correo Electrónico</label
          >
          <input
            type="email"
            name="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            class="w-full bg-white/5 border border-white/10 text-white placeholder-zinc-500 px-4 py-2.5 rounded-xl font-medium text-xs outline-none focus:border-gold focus:ring-1 focus:ring-gold/20 transition-all"
            placeholder="ejemplo@barberia.com"
            required
          />
        </div>

        <div class="mb-4 text-left">
          <label class="block text-[9px] font-bold text-gold uppercase tracking-[2px] mb-1.5"
            ><i class="fa-solid fa-lock mr-1 text-[8px]"></i> Contraseña</label
          >
          <input
            type="password"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            class="w-full bg-white/5 border border-white/10 text-white placeholder-zinc-500 px-4 py-2.5 rounded-xl font-medium text-xs outline-none focus:border-gold focus:ring-1 focus:ring-gold/20 transition-all"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="mb-5 text-right">
          <span
            class="text-zinc-500 hover:text-gold text-[10px] font-semibold cursor-pointer transition"
            >¿Olvidaste tu contraseña?</span
          >
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-black font-extrabold py-2.5 px-8 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg hover:shadow-yellow-500/20 active:scale-95 cursor-pointer"
        >
          Iniciar Sesión
        </button>
      </form>

      <div class="mt-8 border-t border-white/5 pt-4 text-center">
        <p class="text-[9px] font-bold text-zinc-400 uppercase tracking-[2px] mb-3">
          Acceso Rápido Demo:
        </p>
        <div class="flex flex-wrap justify-center gap-2">
          <button
            class="border border-gold/30 hover:border-gold text-gold/80 hover:text-black hover:bg-gold px-3.5 py-1.5 rounded-xl text-[9px] font-extrabold uppercase tracking-widest transition cursor-pointer"
            (click)="quickLogin('admin@barberia.com', 'admin')"
          >
            Admin
          </button>
          <button
            class="border border-gold/30 hover:border-gold text-gold/80 hover:text-black hover:bg-gold px-3.5 py-1.5 rounded-xl text-[9px] font-extrabold uppercase tracking-widest transition cursor-pointer"
            (click)="quickLogin('barbero@barberia.com', 'barbero')"
          >
            Barbero
          </button>
          <button
            class="border border-gold/30 hover:border-gold text-gold/80 hover:text-black hover:bg-gold px-3.5 py-1.5 rounded-xl text-[9px] font-extrabold uppercase tracking-widest transition cursor-pointer"
            (click)="quickLogin('cliente@barberia.com', 'cliente')"
          >
            Cliente
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
